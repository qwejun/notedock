services:
  notedock:
    image: ghcr.io/qwejun/notedock:latest
    platform: linux/amd64
    container_name: notedock
    restart: unless-stopped
    environment:
      NOTEDOCK_WEB_DIR: /srv/web
    volumes:
      - notedock-data:/data
    ports:
      - "${NOTEDOCK_PORT:-8080}:8080"

volumes:
  notedock-data:
